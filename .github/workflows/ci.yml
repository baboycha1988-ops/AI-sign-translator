# Runs automatically on every push. Open the "Actions" tab on GitHub to see real results.
# NOTE: this workflow was written but has not been run yet.
name: tests
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: bash scripts/run_tests.sh

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: signtranslator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d signtranslator -f db/migrations/0001_initial.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d signtranslator -f db/tests/constraints.sql
