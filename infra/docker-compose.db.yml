# Local PostgreSQL for development and DB tests.
# Usage: copy .env.example to .env, set POSTGRES_PASSWORD, then:
#   docker compose -f infra/docker-compose.db.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: signtranslator
      POSTGRES_USER: signtranslator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signtranslator -d signtranslator"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dbdata:
